<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Orbs</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Orbs">
<meta name="theme-color" content="#05060a">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="icon" href="./icons/icon-192.png" type="image/png">
<style>
:root {
  /* Older iOS (11.0-11.2) shipped constant(); modern iOS uses env().
     Declared constant() first so env() overrides it where supported.
     main.js reads these four with getComputedStyle to inset the canvas HUD. */
  --safe-t: constant(safe-area-inset-top, 0px);
  --safe-r: constant(safe-area-inset-right, 0px);
  --safe-b: constant(safe-area-inset-bottom, 0px);
  --safe-l: constant(safe-area-inset-left, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #000;
  overflow: hidden;
}

body {
  position: fixed;
  inset: 0;
  touch-action: none;
  overscroll-behavior: none;
  overscroll-behavior-y: none;
  -webkit-overflow-scrolling: auto;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-drag: none;
}

canvas#stage {
  display: block;
  position: fixed;
  left: 0;
  top: 0;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  touch-action: none;
  outline: none;
}

* {
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script type="module" src="./main.js"></script>
<script>
(function () {
  try {
    var h = location.hostname;
    var secure = location.protocol === 'https:' || h === 'localhost' || h === '127.0.0.1' || h === '[::1]';
    if (secure && 'serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        try {
          navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(function () {});
        } catch (e) {}
      });
    }
  } catch (e) {}
})();
</script>
</body>
</html>
