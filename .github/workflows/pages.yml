name: Deploy Orbs to GitHub Pages

# Publishes ./orbs as the site ROOT, so the app lives at
#   https://<owner>.github.io/<repo>/
# rather than at /orbs/. index.html, sw.js and manifest.webmanifest all use
# relative paths ('./'), so the app works at either location — but serving it at
# the root keeps the Home Screen URL short.

on:
  push:
    branches:
      - main
      - master
      - claude/orbs-physics-toy-6vnxwx
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Do not cancel a running deploy — a half-published site is
# worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Kept separate from the deploy so the test signal stays meaningful even when
  # Pages has not been enabled on the repository yet.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No install step and no build step: plain node + node:assert.
      - name: node test.js
        working-directory: orbs
        run: node test.js

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement: true asks the API to switch Pages on. The default GITHUB_TOKEN
      # is often NOT permitted to do that on a repository where Pages has never been
      # enabled, and the step then fails with:
      #     Create Pages site failed. Error: Resource not accessible by integration
      # That is a one-time repository setting, not something this workflow can fix:
      #     Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
      # Once that is set, every later run of this workflow deploys on its own.
      - name: Configure Pages
        id: configure
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: orbs

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Where it went
        run: echo "Published to ${{ steps.deployment.outputs.page_url }}"
